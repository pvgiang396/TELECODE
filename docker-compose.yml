version: '3.8'

services:
  # Telegram Bot
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: telegram-vscode-bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      VSCODE_PUBLIC_URL: ${VSCODE_PUBLIC_URL}
      MINI_APP_URL: ${MINI_APP_URL}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./bot.py:/app/bot.py:ro
    restart: unless-stopped
    networks:
      - vscode-network
    depends_on:
      - code-server
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # VS Code Server
  code-server:
    image: codercom/code-server:latest
    container_name: telegram-vscode-server
    environment:
      PASSWORD: ${VSCODE_PASSWORD:-password}
      SUDO_PASSWORD: ${VSCODE_PASSWORD:-password}
      SUDO_PASSWORD_HASH: ""
      CERT: "false"
    volumes:
      - ./workspace:/home/coder/project  # Mount your project here
      - code-server-data:/home/coder/.local
      - code-server-config:/home/coder/.config
    ports:
      - "8443:8443"
    restart: unless-stopped
    networks:
      - vscode-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Cloudflare Tunnel for exposing to internet
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: telegram-vscode-tunnel
    command: "tunnel --url http://code-server:8443"
    restart: unless-stopped
    networks:
      - vscode-network
    depends_on:
      - code-server
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Simple web server for mini_app.html
  web-server:
    image: nginx:alpine
    container_name: telegram-vscode-web
    volumes:
      - ./mini_app.html:/usr/share/nginx/html/mini_app.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - vscode-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  code-server-data:
  code-server-config:

networks:
  vscode-network:
    driver: bridge

# Usage:
# 1. Create .env file from .env.example
# 2. Create workspace directory: mkdir workspace
# 3. Run: docker-compose up -d
# 4. Check logs: docker-compose logs -f
# 5. Access bot via Telegram
# 6. Get tunnel URL from: docker-compose logs tunnel | grep trycloudflare
# 7. Stop: docker-compose down
