<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Telecode</title>
<link rel="icon" href="/icon.png" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #1e1e1e; color: #e5e5e5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body { display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; justify-content: flex-start;
    padding: 10px 18px; border-bottom: 1px solid #3c3c3c; background: #252526;
    flex: 0 0 auto;
  }
  header .header-actions { display: flex; align-items: center; gap: 4px; }
  header .icon-btn {
    background: none; border: none; cursor: pointer; font-size: 16px;
    padding: 6px 8px; border-radius: 6px; color: #e5e5e5; line-height: 1;
  }
  header .icon-btn:hover { background: #3c3c3c; }
  main.main-content { padding: 40px 24px; text-align: center; color: #9a9a9a; font-size: 13px; flex: 1 1 auto; min-height: 0; }
  main.main-content.has-vscode { padding: 0; }
  #vscodeFrame { display: block; width: 100%; height: 100%; border: none; }
  .card { width: 100%; max-width: 560px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #9a9a9a; font-size: 13px; margin-bottom: 24px; }
  .step {
    background: #252526; border: 1px solid #3c3c3c; border-radius: 8px;
    padding: 16px; margin-bottom: 14px;
  }
  .step h2 { font-size: 14px; margin: 0 0 10px; color: #cfcfcf; }
  .radio-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
  .radio-row label { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  input[type="radio"] { accent-color: #3f83f8; width: 16px; height: 16px; }
  input[type="text"], input[type="password"] {
    width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #4b5563;
    background: #1e1e1e; color: #e5e5e5; font-size: 14px; margin-top: 6px;
  }
  input:focus { outline: 2px solid #3f83f8; }
  .hint { font-size: 12px; color: #8a8a8a; margin-top: 6px; }
  .hint a { color: #3f83f8; }
  .pw-wrap { position: relative; }
  .pw-wrap button {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; font-size: 16px; padding: 4px;
  }
  #submitBtn {
    width: 100%; padding: 12px; border: none; border-radius: 6px; margin-top: 8px;
    background: #3f83f8; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  #submitBtn:disabled { opacity: 0.6; cursor: default; }
  #msg { margin-top: 14px; font-size: 14px; text-align: center; min-height: 20px; }
  #msg.err { color: #f87171; }
  #msg.ok { color: #4ade80; }
  #loading { text-align: center; padding: 60px 0; color: #9a9a9a; }
  details.collapse { padding: 0; overflow: hidden; }
  details.collapse summary {
    list-style: none; cursor: pointer; padding: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  details.collapse summary::-webkit-details-marker { display: none; }
  details.collapse summary::marker { content: ""; }
  details.collapse .chevron {
    display: inline-block; font-size: 11px; color: #8a8a8a;
    transition: transform .15s ease; flex-shrink: 0;
  }
  details.collapse[open] .chevron { transform: rotate(90deg); }
  details.collapse summary h2 { margin: 0; flex: 1; }
  details.collapse[open] summary { border-bottom: 1px solid #3c3c3c; }
  details.collapse .collapse-body { padding: 4px 16px 4px; }
  .sub-item { padding: 10px 0; border-top: 1px solid #3c3c3c; }
  .sub-item:first-child { border-top: none; }
  .sub-item h3 { font-size: 13px; margin: 0 0 8px; color: #cfcfcf; font-weight: 600; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55);
    align-items: flex-start; justify-content: center; padding: 24px; overflow-y: auto; z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    width: 100%; max-width: 560px; background: #1e1e1e; border: 1px solid #3c3c3c;
    border-radius: 10px; padding: 24px;
  }
  .modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .modal-header h1 { flex: 1; }
</style>
</head>
<body>
  <header>
    <div class="header-actions">
      <button type="button" id="btnSettings" class="icon-btn" title="Cấu hình cài đặt">⚙️</button>
      <button type="button" id="btnUpdate" class="icon-btn" title="Cập nhật ứng dụng">🔄</button>
    </div>
  </header>

  <main class="main-content" id="mainContent">
    Dùng icon ⚙️ ở góc trên để mở lại "CẤU HÌNH CÀI ĐẶT".
  </main>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal-box card">
      <div class="modal-header">
        <h1>⚙️ CẤU HÌNH CÀI ĐẶT</h1>
        <button type="button" id="closeSettings" class="icon-btn" title="Đóng">✕</button>
      </div>
      <div class="sub">Chọn xong bấm "Lưu cấu hình" — cài đặt sẽ tự tiếp tục ở nền.</div>
      <div id="loading">Đang kiểm tra trạng thái máy...</div>
      <form id="form" style="display:none"></form>
      <div id="msg"></div>
    </div>
  </div>

<script>
const form = document.getElementById('form');
const loading = document.getElementById('loading');
const msg = document.getElementById('msg');
const settingsModal = document.getElementById('settingsModal');
// Cửa sổ Tauri thật (main.rs mở với ?tauri=1) KHÔNG được tự window.close() — webview bị blank
// trắng vì unload nội dung trước khi Rust kịp prevent_close()/hide() (bug thật đã gặp). Ngược lại,
// chạy độc lập qua CLI (wizard.py tự mở Chrome --app=) thì window.close() vẫn hoạt động đúng như cũ.
const isTauriWindow = new URLSearchParams(location.search).get('tauri') === '1';

// Trang chính (phía sau modal cấu hình) tự vẽ VS Code (iframe, code-server không set
// X-Frame-Options nên nhúng được) ngay khi code-server đã chạy — trước đó (lần đầu cài
// hoặc đang cài nền sau khi Lưu cấu hình) hiện thông báo + tự poll /api/status tới khi sẵn sàng.
const mainContent = document.getElementById('mainContent');
let statusPollTimer = null;
function renderMainContent(s) {
  if (s.codeServerRunning) {
    if (statusPollTimer) { clearInterval(statusPollTimer); statusPollTimer = null; }
    if (!document.getElementById('vscodeFrame')) {
      mainContent.classList.add('has-vscode');
      mainContent.innerHTML = `<iframe id="vscodeFrame" src="http://127.0.0.1:${s.vscodePort || 8443}/"></iframe>`;
    }
  } else {
    mainContent.classList.remove('has-vscode');
    mainContent.textContent = 'Đang cài đặt code-server ở nền — dùng icon ⚙️ để xem/đổi cấu hình, VS Code sẽ tự hiện ở đây khi xong.';
    if (!statusPollTimer) {
      statusPollTimer = setInterval(() => {
        fetch('/api/status').then(r => r.json()).then(renderMainContent).catch(() => {});
      }, 3000);
    }
  }
}

function openSettings() { settingsModal.classList.add('open'); }
function closeSettingsModal() { settingsModal.classList.remove('open'); }

document.getElementById('btnSettings').addEventListener('click', openSettings);
document.getElementById('closeSettings').addEventListener('click', closeSettingsModal);

document.getElementById('btnUpdate').addEventListener('click', () => {
  if (!confirm('Cập nhật ứng dụng lên bản build mới nhất? Ứng dụng sẽ tự khởi động lại sau khi xong (có thể mất vài phút).')) return;
  const btn = document.getElementById('btnUpdate');
  btn.disabled = true;
  btn.textContent = '⏳';
  fetch('/api/self-update', { method: 'POST' })
    .then(r => r.json())
    .then(res => {
      if (res.ok) {
        alert(res.message || 'Đã cập nhật xong, ứng dụng sẽ tự khởi động lại.');
      } else {
        alert('❌ Lỗi cập nhật: ' + (res.error || 'không rõ nguyên nhân'));
        btn.disabled = false;
        btn.textContent = '🔄';
      }
    })
    .catch(() => {
      alert('❌ Lỗi kết nối khi gọi cập nhật.');
      btn.disabled = false;
      btn.textContent = '🔄';
    });
});

function radioGroup(name, label, current) {
  return `<div class="step">
    <h2>${label}</h2>
    <div class="radio-row">
      <label><input type="radio" name="${name}" value="keep" checked> Giữ nguyên</label>
      <label><input type="radio" name="${name}" value="redo"> Cài lại / khởi động lại</label>
    </div>
    <div class="hint">Hiện tại: ${current}</div>
  </div>`;
}

// Nội dung 1 mục ĐÃ CÀI/ĐANG CHẠY sẵn (mặc định chọn "Giữ nguyên") — chỉ phần
// bên trong, không tự bọc collapse riêng (4 mục này gộp chung 1 collapse duy nhất).
function subRadioGroup(name, label, current) {
  return `<div class="sub-item">
    <h3>${label} — hiện tại: ${current}</h3>
    <div class="radio-row">
      <label><input type="radio" name="${name}" value="keep" checked> Giữ nguyên</label>
      <label><input type="radio" name="${name}" value="redo"> Cài lại / khởi động lại</label>
    </div>
  </div>`;
}

fetch('/api/status').then(r => r.json()).then(s => {
  renderMainContent(s);
  let html = '';

  // 4 mục đã cài/đang chạy sẵn -> gộp chung 1 collapse duy nhất (đóng mặc định).
  // Mục nào CHƯA cài thì không xuất hiện ở đây (và cũng không có ở đâu khác).
  let installedHtml = '';
  if (s.codeServerInstalled) {
    installedHtml += subRadioGroup('codeServerAction', 'code-server', `đã cài (${s.codeServerVersion})`);
  }
  if (s.codeServerRunning) {
    installedHtml += subRadioGroup('codeServerRunAction', 'code-server: tiến trình', `đang chạy (PID ${s.codeServerPid})`);
  }
  if (s.tailscaleInstalled) {
    installedHtml += subRadioGroup('tailscaleAction', 'Tailscale', `đã cài (${s.tailscaleVersion})`);
  }
  if (s.funnelConfigured) {
    installedHtml += subRadioGroup('funnelAction', 'Tailscale Funnel', `đã cấu hình (${s.tailscaleUrl || 'chưa rõ URL'})`);
  }
  if (installedHtml) {
    html += `<details class="step collapse">
      <summary>
        <span class="chevron">▸</span>
        <h2>Đã cài đặt sẵn (bấm để xem/đổi)</h2>
      </summary>
      <div class="collapse-body">${installedHtml}</div>
    </details>`;
  }

  html += `<div class="step">
    <h2>Mật khẩu code-server</h2>
    <div class="pw-wrap">
      <input type="password" id="password" name="password" value="${s.currentPassword || ''}" placeholder="Nhập mật khẩu" required>
      <button type="button" id="togglePw">👁</button>
    </div>
    <div class="hint">${s.currentPassword ? 'Để trống thì giữ mật khẩu cũ, đổi thì máy sẽ tự restart code-server.' : 'Chưa có mật khẩu, bắt buộc nhập mới.'}</div>
  </div>`;

  html += `<div class="step">
    <h2>Token bot Telegram</h2>
    <div class="pw-wrap">
      <input type="password" id="token" name="token" value="${s.currentToken || ''}" placeholder="Lấy từ @BotFather (/newbot)" required>
      <button type="button" id="toggleToken">👁</button>
    </div>
    <div class="hint">${s.currentToken ? 'Đã có token đã lưu, để nguyên là giữ token cũ.' : 'Chưa có token, bắt buộc nhập.'}</div>
  </div>`;

  html += `<div class="step">
    <h2>Codex CLI qua 9Router (Gemini) — tuỳ chọn</h2>
    <div class="pw-wrap">
      <input type="password" id="openaiApiKey" name="openaiApiKey" value="${s.currentOpenaiApiKey || ''}" placeholder="OPENAI_API_KEY (để trống nếu chưa dùng)">
      <button type="button" id="toggleOpenaiApiKey">👁</button>
    </div>
    <div class="hint">${s.currentOpenaiApiKey ? 'Đã có key đã lưu, để nguyên là giữ key cũ.' : 'Để trống = bỏ qua, có thể bổ sung sau bằng cách chạy lại wizard.'}</div>
  </div>`;

  html += `<div class="step">
    <h2>GitHub Copilot CLI (agent "Copilot CLI" trong Gemini) — tuỳ chọn</h2>
    <div class="pw-wrap">
      <input type="password" id="githubCopilotPat" name="githubCopilotPat" value="${s.currentGithubCopilotPat || ''}" placeholder="PAT quyền &quot;Copilot Requests&quot; (để trống nếu chưa dùng)">
      <button type="button" id="toggleGithubCopilotPat">👁</button>
    </div>
    <div class="hint">${s.currentGithubCopilotPat ? 'Đã có PAT đã lưu, để nguyên là giữ PAT cũ.' : 'Tạo tại <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a>, bật quyền "Copilot Requests", <a href="/pat-guide.html" onclick="window.open(\'/pat-guide.html\',\'patGuide\',\'noopener,noreferrer,width=900,height=750,menubar=no,toolbar=no,location=no,status=no\'); return false;">Click vào đây</a> để xem hướng dẫn cách tạo token. Để trống = bỏ qua.'}</div>
  </div>`;

  html += `<div class="step">
    <h2>Thư mục nhận ảnh/file gửi qua Telegram</h2>
    <input type="text" id="fileInboxDir" name="fileInboxDir" value="${s.currentFileInboxDir || ''}" placeholder="Đường dẫn thư mục" required>
    <div class="hint">Ảnh hoặc file bất kỳ gửi thẳng cho bot (chat riêng) sẽ tự lưu vào đây trên máy này. Mặc định là thư mục con "files" trong thư mục cài telecode.</div>
  </div>`;

  if (s.botRunning) {
    html += radioGroup('botAction', 'Bot Telegram', `đang chạy (PID ${s.botPid})`);
  }

  html += `<button type="submit" id="submitBtn">Lưu cấu hình</button>`;

  form.innerHTML = html;
  loading.style.display = 'none';
  form.style.display = 'block';
  openSettings();

  document.getElementById('togglePw').addEventListener('click', () => {
    const p = document.getElementById('password');
    p.type = p.type === 'password' ? 'text' : 'password';
  });
  document.getElementById('toggleToken').addEventListener('click', () => {
    const t = document.getElementById('token');
    t.type = t.type === 'password' ? 'text' : 'password';
  });
  document.getElementById('toggleOpenaiApiKey').addEventListener('click', () => {
    const k = document.getElementById('openaiApiKey');
    k.type = k.type === 'password' ? 'text' : 'password';
  });
  document.getElementById('toggleGithubCopilotPat').addEventListener('click', () => {
    const p = document.getElementById('githubCopilotPat');
    p.type = p.type === 'password' ? 'text' : 'password';
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const answers = Object.fromEntries(fd.entries());
    document.getElementById('submitBtn').disabled = true;
    msg.className = ''; msg.textContent = 'Đang lưu...';
    fetch('/api/save', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(answers) })
      .then(r => r.json())
      .then(() => {
        msg.className = 'ok';
        if (isTauriWindow) {
          msg.textContent = '✅ Đã lưu! Cài đặt đang tiếp tục ở nền — có thể đóng cửa sổ này bằng nút X, ứng dụng vẫn chạy ở khay hệ thống.';
          closeSettingsModal();
          renderMainContent({ codeServerRunning: false });
        } else {
          msg.textContent = '✅ Đã lưu! Cài đặt đang tiếp tục ở nền — cửa sổ này và terminal sẽ tự đóng khi xong.';
          // Đóng cửa sổ này sau khi lưu xong — chỉ hoạt động nếu trình duyệt cho phép
          // script tự đóng cửa sổ --app= (thường được vì không phải tab thường); nếu
          // trình duyệt chặn thì người dùng vẫn thấy thông báo trên để tự đóng tay.
          setTimeout(() => window.close(), 1500);
        }
      })
      .catch(() => {
        msg.className = 'err';
        msg.textContent = '❌ Lỗi khi lưu, thử lại.';
        document.getElementById('submitBtn').disabled = false;
      });
  });
}).catch(() => {
  loading.textContent = 'Không lấy được trạng thái máy — kiểm tra lại terminal.';
  openSettings();
});

// Chặn chuột phải để giống 1 app desktop thật (mở kèm --app= ẩn sẵn thanh địa chỉ)
// — chỉ ngăn cản hình thức, không phải cơ chế bảo mật.
document.addEventListener('contextmenu', (e) => e.preventDefault());
</script>
</body>
</html>
