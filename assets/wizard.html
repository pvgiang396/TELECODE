<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cài đặt telecode</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; min-height: 100vh;
    background: #1e1e1e; color: #e5e5e5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center;
  }
  .card { width: 100%; max-width: 560px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #9a9a9a; font-size: 13px; margin-bottom: 24px; }
  .step {
    background: #252526; border: 1px solid #3c3c3c; border-radius: 8px;
    padding: 16px; margin-bottom: 14px;
  }
  .step h2 { font-size: 14px; margin: 0 0 10px; color: #cfcfcf; }
  .radio-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
  .radio-row label { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  input[type="radio"] { accent-color: #3f83f8; width: 16px; height: 16px; }
  input[type="text"], input[type="password"] {
    width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #4b5563;
    background: #1e1e1e; color: #e5e5e5; font-size: 14px; margin-top: 6px;
  }
  input:focus { outline: 2px solid #3f83f8; }
  .hint { font-size: 12px; color: #8a8a8a; margin-top: 6px; }
  .pw-wrap { position: relative; }
  .pw-wrap button {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; font-size: 16px; padding: 4px;
  }
  #submitBtn {
    width: 100%; padding: 12px; border: none; border-radius: 6px; margin-top: 8px;
    background: #3f83f8; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  #submitBtn:disabled { opacity: 0.6; cursor: default; }
  #msg { margin-top: 14px; font-size: 14px; text-align: center; min-height: 20px; }
  #msg.err { color: #f87171; }
  #msg.ok { color: #4ade80; }
  #loading { text-align: center; padding: 60px 0; color: #9a9a9a; }
</style>
</head>
<body>
  <div class="card">
    <h1>🚀 Cài đặt telecode</h1>
    <div class="sub">Chọn xong bấm "Bắt đầu cài đặt" — terminal sẽ tự tiếp tục ở nền, không cần quay lại đó.</div>
    <div id="loading">Đang kiểm tra trạng thái máy...</div>
    <form id="form" style="display:none"></form>
    <div id="msg"></div>
  </div>

<script>
const form = document.getElementById('form');
const loading = document.getElementById('loading');
const msg = document.getElementById('msg');

function radioGroup(name, label, current) {
  return `<div class="step">
    <h2>${label}</h2>
    <div class="radio-row">
      <label><input type="radio" name="${name}" value="keep" checked> Giữ nguyên</label>
      <label><input type="radio" name="${name}" value="redo"> Cài lại / khởi động lại</label>
    </div>
    <div class="hint">Hiện tại: ${current}</div>
  </div>`;
}

fetch('/api/status').then(r => r.json()).then(s => {
  let html = '';

  if (s.codeServerInstalled) {
    html += radioGroup('codeServerAction', 'code-server', `đã cài (${s.codeServerVersion})`);
  }

  html += `<div class="step">
    <h2>Mật khẩu code-server</h2>
    <div class="pw-wrap">
      <input type="password" id="password" name="password" value="${s.currentPassword || ''}" placeholder="Nhập mật khẩu" required>
      <button type="button" id="togglePw">👁</button>
    </div>
    <div class="hint">${s.currentPassword ? 'Để trống thì giữ mật khẩu cũ, đổi thì máy sẽ tự restart code-server.' : 'Chưa có mật khẩu, bắt buộc nhập mới.'}</div>
  </div>`;

  if (s.codeServerRunning) {
    html += radioGroup('codeServerRunAction', 'code-server: tiến trình', `đang chạy (PID ${s.codeServerPid})`);
  }

  if (s.cloudflaredInstalled) {
    html += radioGroup('cloudflaredAction', 'cloudflared', `đã cài (${s.cloudflaredVersion})`);
  }

  if (s.tunnelRunning) {
    html += radioGroup('tunnelAction', 'Tunnel code-server', `đang chạy (${s.tunnelUrl || 'PID ' + s.tunnelPid})`);
  }

  html += `<div class="step">
    <h2>Token bot Telegram</h2>
    <div class="pw-wrap">
      <input type="password" id="token" name="token" value="${s.currentToken || ''}" placeholder="Lấy từ @BotFather (/newbot)" required>
      <button type="button" id="toggleToken">👁</button>
    </div>
    <div class="hint">${s.currentToken ? 'Đã có token đã lưu, để nguyên là giữ token cũ.' : 'Chưa có token, bắt buộc nhập.'}</div>
  </div>`;

  if (s.botRunning) {
    html += radioGroup('botAction', 'Bot Telegram', `đang chạy (PID ${s.botPid})`);
  }

  html += `<button type="submit" id="submitBtn">Bắt đầu cài đặt</button>`;

  form.innerHTML = html;
  loading.style.display = 'none';
  form.style.display = 'block';

  document.getElementById('togglePw').addEventListener('click', () => {
    const p = document.getElementById('password');
    p.type = p.type === 'password' ? 'text' : 'password';
  });
  document.getElementById('toggleToken').addEventListener('click', () => {
    const t = document.getElementById('token');
    t.type = t.type === 'password' ? 'text' : 'password';
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const answers = Object.fromEntries(fd.entries());
    document.getElementById('submitBtn').disabled = true;
    msg.className = ''; msg.textContent = 'Đang lưu...';
    fetch('/api/save', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(answers) })
      .then(r => r.json())
      .then(() => {
        msg.className = 'ok';
        msg.textContent = '✅ Đã lưu! Cài đặt đang tiếp tục ở nền — bạn có thể đóng tab này và đóng terminal.';
      })
      .catch(() => {
        msg.className = 'err';
        msg.textContent = '❌ Lỗi khi lưu, thử lại.';
        document.getElementById('submitBtn').disabled = false;
      });
  });
}).catch(() => {
  loading.textContent = 'Không lấy được trạng thái máy — kiểm tra lại terminal.';
});

// Chặn chuột phải để giống 1 app desktop thật (mở kèm --app= ẩn sẵn thanh địa chỉ)
// — chỉ ngăn cản hình thức, không phải cơ chế bảo mật.
document.addEventListener('contextmenu', (e) => e.preventDefault());
</script>
</body>
</html>
