[package]
name = "telecode"
version = "0.1.0"
description = "Desktop shell cho telecode — Tauri + Python sidecar (PyInstaller), kế thừa nguyên vẹn wizard.py/setup.sh từ telecode"
edition = "2021"

[lib]
# Bắt buộc phải có lib target để build Android/iOS (`cargo tauri android build` chạy `cargo build
# --lib`, JNI load .so sinh ra từ đây) — desktop (Linux/Windows) VẪN dùng src/main.rs như cũ, KHÔNG
# đụng gì tới lib.rs (2 entry point hoàn toàn tách biệt, xem lib.rs's docstring).
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
# Đóng cửa sổ giờ chỉ ẩn (không thoát) — nếu không có guard này, bấm icon desktop lần 2 trong lúc
# app đã chạy nền sẽ spawn thêm 1 sidecar wizard-server tranh chấp cùng config.yaml/port 8899.
# Cùng pattern k8sql (xem k8sql/CLAUDE.md Phase 8).
tauri-plugin-single-instance = "2"
