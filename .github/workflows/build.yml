name: Build Telecode

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated targets: linux,windows,macos,android,ios"
        required: true
        default: "linux,windows,macos,android,ios"
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - id: targets
        env:
          INPUT_TARGETS: ${{ github.event.inputs.targets || 'linux,windows,macos,android,ios' }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          allowed = {"linux", "windows", "macos", "android", "ios"}
          targets = []
          for item in os.environ["INPUT_TARGETS"].split(","):
              value = item.strip().lower().replace("win32", "windows").replace("darwin", "macos")
              if value in allowed and value not in targets:
                  targets.append(value)
          if not targets:
              raise SystemExit("No valid target selected")
          print("matrix=" + json.dumps({"target": targets}, separators=(",", ":")))
          PY

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ (matrix.target == 'macos' || matrix.target == 'ios') && 'macos-15' || matrix.target == 'windows' && 'windows-2025' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf python3-tk
      - name: Install Android toolchain
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        if: matrix.target == 'android'
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
      - name: Install Java 17
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Python and Node dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sidecar/requirements.txt pyinstaller
          npm ci
      - name: Build Linux desktop
        if: matrix.target == 'linux'
        run: npm run build -- --targets linux
      - name: Build Windows desktop
        if: matrix.target == 'windows'
        run: npm run build -- --targets win32
      - name: Build macOS desktop
        if: matrix.target == 'macos'
        run: npm run build -- --targets darwin
      - name: Build Android
        if: matrix.target == 'android'
        run: npm run build:android
      - name: Prepare iOS project
        if: matrix.target == 'ios'
        run: |
          cd src-tauri
          npx tauri ios init
      - name: Build iOS
        if: matrix.target == 'ios'
        run: |
          cd src-tauri
          npx tauri ios build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telecode-${{ matrix.target }}
          path: |
            dist/**/*
            src-tauri/gen/apple/build/**/*
            src-tauri/gen/android/app/build/outputs/**/*
          if-no-files-found: error
