# Telecode - Configuration
# Copy this file to config.yaml and update values

# OPENAI_API_KEY dùng cho Codex CLI extension (openai.chatgpt) qua 9Router (Gemini)
# — dùng API key router/OpenAI (thường `sk-...`), KHÔNG dùng token Codex `AQ...`.
# Để trống (giữ giá trị mặc định bên dưới) nếu chưa dùng, setup.sh sẽ bỏ qua.
# bước cài Codex. base_url/model của 9Router cố định, ghi thẳng trong setup.sh.
OPENAI_API_KEY: "YOUR_OPENAI_API_KEY_HERE"

# GITHUB_COPILOT_PAT dùng cho agent "Copilot CLI" trong Gemini Code Assist (tiến
# trình con `copilot` kế thừa biến GH_TOKEN từ environment của code-server) — fine-
# grained PAT tạo tại https://github.com/settings/personal-access-tokens/new, bật
# quyền "Copilot Requests". Để trống nếu chưa dùng, setup.sh sẽ bỏ qua bước này.
GITHUB_COPILOT_PAT: "YOUR_GITHUB_COPILOT_PAT_HERE"

# VS Code Server Configuration
VSCODE_PORT: 8443
VSCODE_PASSWORD: "your-secure-password"

# Public URL for VS Code Server — Tailscale Funnel (https://<máy>.<tailnet>.ts.net),
# tự lấy được bởi setup.sh ở bước cấu hình Funnel, không cần tự điền tay ở đây.
VSCODE_PUBLIC_URL: "https://your-machine.your-tailnet.ts.net"

# VS Code Server Settings
VSCODE_AUTH_REQUIRED: true
VSCODE_ALLOW_INSECURE: false

# Logging
LOG_LEVEL: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL

# Advanced
ENABLE_DEBUG_MODE: false
ALLOW_MULTIPLE_CONNECTIONS: false

# Notes:
# 1. VSCODE_PUBLIC_URL tự lấy từ `tailscale status` khi chạy setup.sh (bước Tailscale
#    Funnel) — cần cài + đăng nhập Tailscale trước.
# 2. Keep VSCODE_PASSWORD strong (min 12 characters).
