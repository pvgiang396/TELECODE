<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1e1e1e">
    <title>VS Code Remote - Telegram</title>
    
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --tg-color-text: #000000;
            --tg-color-bg: #ffffff;
            --tg-color-secondary-bg: #f5f5f5;
            --tg-color-hint: #999999;
            --tg-color-link: #0084ff;
            --tg-color-button-text: #ffffff;
            --tg-color-destructive: #ff3b30;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--tg-color-bg);
            color: var(--tg-color-text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        /* Dark theme for VS Code */
        @media (prefers-color-scheme: dark) {
            :root {
                --tg-color-text: #ffffff;
                --tg-color-bg: #1e1e1e;
                --tg-color-secondary-bg: #252526;
                --tg-color-hint: #888888;
            }
            
            body {
                background: var(--tg-color-bg);
                color: var(--tg-color-text);
            }
        }
        
        /* Header */
        .header {
            background: var(--tg-color-secondary-bg);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            flex-shrink: 0;
            z-index: 100;
            min-height: 44px;
            max-height: 60px;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .header-title {
            font-weight: 600;
            font-size: 15px;
        }
        
        .header-status {
            font-size: 11px;
            color: var(--tg-color-hint);
            padding: 2px 6px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 3px;
            min-width: 60px;
            text-align: center;
        }
        
        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 4px;
            animation: pulse 2s infinite;
        }
        
        .status-dot.connected {
            background: #4CAF50;
            animation: none;
        }
        
        .status-dot.connecting {
            background: #FFC107;
        }
        
        .status-dot.error {
            background: #F44336;
            animation: none;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* Frame Container */
        .frame-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        #vscode-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        /* Loading State */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--tg-color-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 50;
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-top: 4px solid var(--tg-color-link);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 14px;
            color: var(--tg-color-hint);
            text-align: center;
            padding: 0 24px;
        }
        
        /* Error State */
        .error-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--tg-color-bg);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 60;
            padding: 24px;
        }
        
        .error-container.visible {
            display: flex;
        }
        
        .error-icon {
            font-size: 48px;
        }
        
        .error-title {
            font-size: 18px;
            font-weight: 600;
        }
        
        .error-message {
            font-size: 14px;
            color: var(--tg-color-hint);
            text-align: center;
            line-height: 1.5;
        }
        
        .retry-button {
            margin-top: 16px;
            padding: 10px 24px;
            background: var(--tg-color-link);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }
        
        .retry-button:active {
            opacity: 0.8;
        }
        
        /* Safe Area */
        @supports (padding: max(0px)) {
            .header {
                padding-top: max(8px, env(safe-area-inset-top));
                padding-left: max(16px, env(safe-area-inset-left));
                padding-right: max(16px, env(safe-area-inset-right));
            }
            
            .frame-container {
                padding-bottom: env(safe-area-inset-bottom);
            }
        }
        
        /* Debug Info (hidden by default) */
        .debug-info {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            font-family: monospace;
            font-size: 11px;
            padding: 8px;
            z-index: 1000;
            max-height: 100px;
            overflow-y: auto;
            line-height: 1.4;
        }
        
        .debug-info.visible {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <span class="header-title">🔧 VS Code</span>
            <div class="header-status">
                <span class="status-dot connecting"></span>
                <span id="status-text">Connecting</span>
            </div>
        </div>
    </div>
    
    <!-- Frame Container -->
    <div class="frame-container">
        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">Initializing VS Code...</div>
        </div>
        
        <!-- Error Container -->
        <div class="error-container" id="error">
            <div class="error-icon">❌</div>
            <div class="error-title">Connection Failed</div>
            <div class="error-message" id="error-message">
                Unable to connect to VS Code Server. Please check your connection and try again.
            </div>
            <button class="retry-button" onclick="retryConnection()">🔄 Retry</button>
        </div>
        
        <!-- VS Code Frame -->
        <iframe id="vscode-frame" title="VS Code"></iframe>
    </div>
    
    <!-- Debug Info -->
    <div class="debug-info" id="debug"></div>
    
    <script>
        // Configuration
        const CONFIG = {
            VSCODE_PUBLIC_URL: 'https://your-tunnel-name.trycloudflare.com', // Change this!
            VSCODE_PORT: 8443,
            RETRY_ATTEMPTS: 3,
            RETRY_DELAY: 2000,
            CONNECTION_TIMEOUT: 10000,
            DEBUG_MODE: false, // Set to true for debugging
        };
        
        // State
        let state = {
            retryCount: 0,
            isConnected: false,
            startTime: Date.now(),
        };
        
        // Elements
        const frame = document.getElementById('vscode-frame');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const errorMessage = document.getElementById('error-message');
        const statusText = document.getElementById('status-text');
        const statusDot = document.querySelector('.status-dot');
        const debug = document.getElementById('debug');
        
        // Telegram WebApp
        let tg = null;
        
        function log(message) {
            console.log(`[VSCode Mini App] ${message}`);
            if (CONFIG.DEBUG_MODE) {
                const timestamp = new Date().toLocaleTimeString();
                debug.textContent += `${timestamp} ${message}\n`;
                debug.classList.add('visible');
                debug.scrollTop = debug.scrollHeight;
            }
        }
        
        function updateStatus(status, isDot = true) {
            statusText.textContent = status;
            if (isDot) {
                statusDot.className = 'status-dot';
                if (status === 'Connected') {
                    statusDot.classList.add('connected');
                } else if (status === 'Error') {
                    statusDot.classList.add('error');
                } else {
                    statusDot.classList.add('connecting');
                }
            }
        }
        
        function showError(message) {
            log(`Error: ${message}`);
            errorMessage.textContent = message;
            loading.classList.add('hidden');
            error.classList.add('visible');
            updateStatus('Error');
        }
        
        function hideError() {
            error.classList.remove('visible');
        }
        
        function retryConnection() {
            log('Retrying connection...');
            hideError();
            loading.classList.remove('hidden');
            updateStatus('Connecting');
            state.retryCount++;
            
            if (state.retryCount <= CONFIG.RETRY_ATTEMPTS) {
                setTimeout(loadVSCode, CONFIG.RETRY_DELAY);
            } else {
                showError('Max retry attempts reached. Check your connection and try again.');
            }
        }
        
        function loadVSCode() {
            log(`Loading VS Code from: ${CONFIG.VSCODE_PUBLIC_URL}`);
            
            // Try to detect if on localhost during development
            const currentHost = window.location.hostname;
            let url = CONFIG.VSCODE_PUBLIC_URL;
            
            // Fallback to localhost if accessing from localhost
            if (currentHost === 'localhost' || currentHost === '127.0.0.1') {
                url = `http://localhost:${CONFIG.VSCODE_PORT}`;
                log(`Development mode detected, using: ${url}`);
            }
            
            // Update iframe source
            frame.src = url;
            
            // Set timeout for connection
            const timeout = setTimeout(() => {
                if (!state.isConnected) {
                    showError('Connection timeout. The VS Code server may be offline.');
                    clearTimeout(timeout);
                }
            }, CONFIG.CONNECTION_TIMEOUT);
            
            // Handle frame load
            frame.onload = () => {
                log('Frame loaded successfully');
                state.isConnected = true;
                clearTimeout(timeout);
                loading.classList.add('hidden');
                hideError();
                updateStatus('Connected');
            };
            
            frame.onerror = () => {
                log('Frame error occurred');
                clearTimeout(timeout);
                showError('Failed to load VS Code. Ensure the server is running.');
            };
        }
        
        // Telegram WebApp Integration
        function initTelegram() {
            if (!window.Telegram?.WebApp) {
                log('Telegram WebApp not available (not in Telegram)');
                return;
            }
            
            tg = window.Telegram.WebApp;
            log(`Telegram WebApp initialized (version ${tg.version})`);
            
            // Set WebApp ready
            tg.ready();
            
            // Expand to full screen
            tg.expand();
            
            // Hide main button
            tg.MainButton.hide();
            
            // Request fullscreen if available
            if (tg.requestFullscreen) {
                tg.requestFullscreen();
            }
            
            // Listen for orientation changes
            tg.onEvent('viewportChanged', () => {
                log('Viewport changed');
            });
            
            // Listen for theme changes
            tg.onEvent('themeChanged', () => {
                log('Theme changed');
            });
        }
        
        // Initialize
        function init() {
            log('Initializing Mini App');
            initTelegram();
            loadVSCode();
            
            // Log system info
            log(`User Agent: ${navigator.userAgent}`);
            log(`Screen: ${window.innerWidth}x${window.innerHeight}`);
            log(`Viewport: ${document.documentElement.clientWidth}x${document.documentElement.clientHeight}`);
        }
        
        // Handle visibility changes
        document.addEventListener('visibilitychange', () => {
            if (document.visible) {
                log('App became visible');
            } else {
                log('App became hidden');
            }
        });
        
        // Handle online/offline
        window.addEventListener('online', () => {
            log('Device online');
            if (!state.isConnected) {
                retryConnection();
            }
        });
        
        window.addEventListener('offline', () => {
            log('Device offline');
            updateStatus('Offline');
        });
        
        // Handle resize
        window.addEventListener('resize', () => {
            log(`Resized to ${window.innerWidth}x${window.innerHeight}`);
        });
        
        // Prevent common gestures that break the experience
        document.addEventListener('gesturestart', (e) => {
            e.preventDefault();
        });
        
        // Start initialization when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            log('Page unloading');
        });
    </script>
</body>
</html>
